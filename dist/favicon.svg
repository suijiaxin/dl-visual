<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131722"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="edge" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 连线：输入层(2) → 隐藏层(3) → 输出层(1) -->
  <g stroke="url(#edge)" stroke-width="1.6" opacity="0.55">
    <!-- 输入 -> 隐藏 -->
    <line x1="16" y1="22" x2="32" y2="14"/>
    <line x1="16" y1="22" x2="32" y2="32"/>
    <line x1="16" y1="22" x2="32" y2="50"/>
    <line x1="16" y1="42" x2="32" y2="14"/>
    <line x1="16" y1="42" x2="32" y2="32"/>
    <line x1="16" y1="42" x2="32" y2="50"/>
    <!-- 隐藏 -> 输出 -->
    <line x1="32" y1="14" x2="48" y2="32"/>
    <line x1="32" y1="32" x2="48" y2="32"/>
    <line x1="32" y1="50" x2="48" y2="32"/>
  </g>

  <!-- 节点 -->
  <g>
    <!-- 输入层 -->
    <circle cx="16" cy="22" r="5" fill="#5b9dff"/>
    <circle cx="16" cy="42" r="5" fill="#5b9dff"/>
    <!-- 隐藏层 -->
    <circle cx="32" cy="14" r="5" fill="#2ee6d6"/>
    <circle cx="32" cy="32" r="5.5" fill="#2ee6d6"/>
    <circle cx="32" cy="50" r="5" fill="#2ee6d6"/>
    <!-- 输出层 -->
    <circle cx="48" cy="32" r="6" fill="#7c5cff"/>
  </g>
</svg>
